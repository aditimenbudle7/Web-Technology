spring.application.name=semester-result-system
server.port=8080

# ---- MySQL connection ----
# Credentials are read from environment variables. Never write a real password in this file.
#   DB_URL       (optional) JDBC URL, defaults to a local MySQL database "semester_result"
#   DB_USERNAME  (optional) defaults to root
#   DB_PASSWORD  (required if your MySQL user has a password)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/semester_result?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---- Thymeleaf ----
spring.thymeleaf.cache=false

# ---- Result rules ----
app.institute-name=Institute of Engineering & Technology
