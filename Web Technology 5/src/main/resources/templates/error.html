<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error | Semester Result System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<main class="container page">
    <section class="card section error-page">
        <h1 th:text="${status} ?: 'Error'">404</h1>
        <p th:text="${status == 404} ? 'The page or result you are looking for does not exist.' : 'Something went wrong. Please try again.'">Message</p>
        <a th:href="@{/}" class="btn btn-primary">Go to dashboard</a>
    </section>
</main>
</body>
</html>
