<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ElectroCalc - Advanced Electricity Bill Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Responsive Navigation Bar -->
    <nav class="navbar">
        <div class="nav-brand">⚡ ElectroCalc</div>
        <div class="nav-links">
            <a href="index.html" class="active">Home</a>
            <a href="#features">Tarrifs & Info</a>
            <button id="theme-toggle" class="theme-btn">🌙</button>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="container animate-fade-in">
        <h1>Electricity Bill Calculator</h1>
        <p class="subtitle">Enter your consumption details below</p>

        <form action="BillServlet" method="post">

            <div class="form-group">
                <label for="name">Consumer Name</label>
                <input type="text" id="name" name="name" placeholder="Enter your name" required>
            </div>

            <div class="form-group">
                <label for="month">Billing Month</label>
                <select id="month" name="month" required>
                    <option value="" disabled selected>Select Month</option>
                    <option value="January">January</option>
                    <option value="February">February</option>
                    <option value="March">March</option>
                    <option value="April">April</option>
                    <option value="May">May</option>
                    <option value="June">June</option>
                    <option value="July">July</option>
                    <option value="August">August</option>
                    <option value="September">September</option>
                    <option value="October">October</option>
                    <option value="November">November</option>
                    <option value="December">December</option>
                </select>
            </div>

            <div class="form-group">
                <label for="category">Consumption Category</label>
                <select id="category" name="category" required>
                    <option value="Domestic" selected>Domestic (Residential)</option>
                    <option value="Commercial">Commercial (Business)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="units">Units Consumed (kWh)</label>
                <input type="number" id="units" name="units" min="0" placeholder="e.g., 180" required>
            </div>

            <div class="form-group">
                <label for="prevBill">Previous Month Bill Amount (Rs.)</label>
                <input type="number" id="prevBill" name="prevBill" min="0" step="0.01" placeholder="e.g., 750" required>
            </div>

            <button type="submit" class="btn-submit">Calculate Comprehensive Bill</button>

        </form>
    </div>

    <!-- Footer Section -->
    <footer class="footer">
        <p>&copy; 2026 ElectroCalc Systems. Designed for transparent utility tracking.</p>
    </footer>

    <script>
        // Inline Theme toggle handler for UI consistency on home page
        const toggleBtn = document.getElementById('theme-toggle');
        const currentTheme = localStorage.getItem('theme') || 'light';
        if (currentTheme === 'dark') {
            document.body.classList.add('dark-mode');
            toggleBtn.textContent = '☀️';
        }
        toggleBtn.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            let theme = 'light';
            if (document.body.classList.contains('dark-mode')) {
                theme = 'dark';
                toggleBtn.textContent = '☀️';
            } else {
                toggleBtn.textContent = '🌙';
            }
            localStorage.setItem('theme', theme);
        });
    </script>
</body>
</html>
