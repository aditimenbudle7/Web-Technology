spring.application.name=bookstore-backend
server.port=8080

# MongoDB connection.
# Uses the MONGODB_URI environment variable if set (e.g. MongoDB Atlas),
# otherwise falls back to a local MongoDB on the default port.
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/bookstore}
   spring.data.mongodb.database=bookstore
spring.data.mongodb.auto-index-creation=true

# Frontend origin allowed to call the API (Vite dev server)
app.cors.allowed-origin=${FRONTEND_URL:http://localhost:5173}
