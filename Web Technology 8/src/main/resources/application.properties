spring.application.name=cricket-score-system
server.port=8080
server.compression.enabled=true

# ---- Live match simulation ----
# How often (ms) the simulator bowls the next ball in every live match
app.simulation.tick-ms=2000
# Chance (0-1) that a live match advances on a given tick (staggers matches)
app.simulation.ball-probability=0.8
# Random seed: 0 = different matches on every start, any other number = repeatable data
app.simulation.seed=0
